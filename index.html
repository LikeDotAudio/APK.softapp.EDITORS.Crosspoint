<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crosspoint Matrix Routing Editor · Standalone Block Editor</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .crosspoint-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .toolbar-bar {
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .form-group-inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group-inline label {
      font-size: 11px;
      font-weight: 600;
      color: var(--osc-text-muted);
      text-transform: uppercase;
    }

    .telemetry-pill {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--osc-accent-primary);
      background: var(--osc-bg-input);
      border: 1px solid var(--osc-border-default);
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .matrix-stage {
      flex: 1;
      min-height: 0;
      gap: 24px;
      background: radial-gradient(circle at 50% 50%, #1e1e24 0%, #121212 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }

    .matrix-host { font-family: var(--font-mono); }
    .dest-host { min-width: 220px; }

    .matrix-btn {
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      background: var(--osc-bg-input);
      border: 1px solid var(--osc-border-default);
      color: transparent;
    }

    .matrix-btn.active {
      background: var(--osc-accent-primary);
      border-color: var(--osc-accent-primary);
      color: #000;
    }

    .discovered-panel {
      border-bottom: 1px solid var(--osc-border-default);
      padding: 8px 14px;
      max-height: 40vh;
      overflow: auto;
    }

    .discovered-panel[hidden] { display: none; }

    .discovered-head {
      display: flex;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 12px;
    }

    [data-apk-state="good"] { color: var(--apk-state-good); }
    [data-apk-state="kinda"] { color: var(--apk-state-kinda); }
    [data-apk-state="dead"] { color: var(--apk-state-dead); }

    .text-center {
      text-align: center;
    }
  </style>
</head>
<body class="theme-deep-horizon">
  <header class="app-window-header">
    <div class="window-title-group">
      <span class="window-dot"></span>
      <span class="window-title">Crosspoint Matrix Routing Editor</span>
      <span class="window-pill" id="block-tag">STANDALONE BLOCK EDITOR</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary" id="btn-sync-discovered" title="Show the routers on the network (the bus), live">
        <span class="btn-icon">⚡</span> Discovered
      </button>
      <button class="btn btn-secondary" id="btn-open" title="Open block JSON">
        <span class="btn-icon">📂</span> Open
      </button>
      <button class="btn btn-primary" id="btn-save" title="Save & Return modified block to caller">
        <span class="btn-icon">💾</span> Save & Return
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close Editor">✕</button>
    </div>
  </header>

  <div class="crosspoint-container">
    <div class="toolbar-bar">
      <div style="display:flex; align-items:center; gap:16px;">
        <div class="form-group-inline">
          <label for="select-dimensions">Matrix Grid:</label>
          <select id="select-dimensions" class="input" style="width:130px;">
            <option value="4">4 × 4 Compact</option>
            <option value="8" selected>8 × 8 Standard</option>
            <option value="16">16 × 16 Studio</option>
            <option value="32">32 × 32 Enterprise</option>
          </select>
        </div>
        <div class="telemetry-pill" id="active-routes">0 Active Routes</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary btn-sm" id="btn-diagonal">1:1 Diagonal Salvo</button>
        <button class="btn btn-secondary btn-sm" id="btn-clear">Clear All Routes</button>
      </div>
    </div>

    <section id="discovered-panel" class="discovered-panel" hidden>
      <div class="discovered-head">
        <strong>Routers on the network</strong>
        <span id="discovered-status" class="discovered-status" data-apk-state="kinda">Not started.</span>
      </div>
      <div id="discovered-table"></div>
    </section>

    <main class="matrix-stage">
      <div id="matrix-table" class="matrix-host"></div>
      <div id="destinations-table" class="dest-host"></div>
    </main>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="./js/crosspointApp.js"></script>
</body>
</html>
