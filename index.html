<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crosspoint Matrix Routing Editor · Standalone Block Editor</title>
  <link rel="stylesheet" href="./css/theme.css">
  <style>
    .crosspoint-container {
      display: grid;
      grid-template-rows: auto 1fr;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .toolbar-bar {
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .form-group-inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group-inline label {
      font-size: 11px;
      font-weight: 600;
      color: var(--osc-text-muted);
      text-transform: uppercase;
    }

    .telemetry-pill {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--osc-accent-primary);
      background: var(--osc-bg-input);
      border: 1px solid var(--osc-border-default);
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .matrix-stage {
      background: radial-gradient(circle at 50% 50%, #151F38 0%, #080C16 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }

    table.matrix-table {
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--osc-bg-surface);
      border: 1px solid var(--osc-border-default);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    table.matrix-table th {
      background: var(--osc-bg-input);
      border: 1px solid var(--osc-border-default);
      padding: 6px 8px;
      color: var(--osc-text-muted);
      font-weight: 600;
    }

    table.matrix-table td {
      border: 1px solid var(--osc-border-default);
      padding: 4px;
      text-align: center;
      background: var(--osc-bg-base);
    }

    .cell-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--osc-text-primary);
      padding: 2px 4px;
      font-size: 11px;
      border-radius: 2px;
      font-family: inherit;
    }

    .cell-input:focus {
      background: var(--osc-bg-input);
      border-color: var(--osc-accent-primary);
      outline: none;
    }

    .text-center {
      text-align: center;
    }
  </style>
</head>
<body class="theme-deep-horizon">
  <header class="app-window-header">
    <div class="window-title-group">
      <span class="window-dot"></span>
      <span class="window-title">Crosspoint Matrix Routing Editor</span>
      <span class="window-pill" id="block-tag">STANDALONE BLOCK EDITOR</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary" id="btn-sync-discovered" title="Load live routing from Discovered Project">
        <span class="btn-icon">⚡</span> Discovered
      </button>
      <button class="btn btn-secondary" id="btn-open" title="Open block JSON">
        <span class="btn-icon">📂</span> Open
      </button>
      <button class="btn btn-primary" id="btn-save" title="Save & Return modified block to caller">
        <span class="btn-icon">💾</span> Save & Return
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close Editor">✕</button>
    </div>
  </header>

  <div class="crosspoint-container">
    <div class="toolbar-bar">
      <div style="display:flex; align-items:center; gap:16px;">
        <div class="form-group-inline">
          <label for="select-dimensions">Matrix Grid:</label>
          <select id="select-dimensions" class="input" style="width:130px;">
            <option value="4">4 × 4 Compact</option>
            <option value="8" selected>8 × 8 Standard</option>
            <option value="16">16 × 16 Studio</option>
            <option value="32">32 × 32 Enterprise</option>
          </select>
        </div>
        <div class="telemetry-pill" id="active-routes">0 Active Routes</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary btn-sm" id="btn-diagonal">1:1 Diagonal Salvo</button>
        <button class="btn btn-secondary btn-sm" id="btn-clear">Clear All Routes</button>
      </div>
    </div>

    <main class="matrix-stage">
      <table class="matrix-table" id="matrix-table"></table>
    </main>
  </div>

  <script type="module" src="./js/crosspointApp.js"></script>
</body>
</html>
